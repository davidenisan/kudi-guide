name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install receipt tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Generate database client
        run: pnpm --filter api prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kudi_guide_test

      - name: Test
        run: pnpm --filter api test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
